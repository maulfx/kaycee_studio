<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kaycee Studio - Dashboard Multi-Akun TikTok, Kontrak & Event</title>
  <meta name="description" content="Dashboard manajemen konten TikTok multi-akun, kontrak sponsor brand, proyek ads promo, turnamen game, dan integrasi Hermes AI." />
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%2300f2fe'><path d='M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5'/></svg>" />
  <link rel="stylesheet" href="/src/css/style.css" />
</head>
<body>
  <div class="app-layout">
    <!-- Sidebar Navigation -->
    <aside class="sidebar">
      <div class="sidebar-header">
        <div class="brand-badge" title="Kaycee Studio Pro">
          <div class="brand-logo-icon">KC</div>
          <div class="brand-info">
            <h1>KAYCEE STUDIO</h1>
            <div class="brand-sub">CREATOR HUB PRO</div>
          </div>
        </div>
      </div>

      <nav class="sidebar-nav">
        <div class="nav-section-title">Menu Utama</div>

        <a href="#tiktok" class="nav-item active" data-tab="tiktok" id="navTikTok">
          <span class="nav-icon">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 12a4 4 0 1 0 4 4V4a5 5 0 0 0 5 5"/></svg>
          </span>
          <span>TikTok Multi-Akun</span>
          <span class="nav-badge glow-cyan" id="navTikTokBadge">0 Akun</span>
        </a>

        <a href="#contracts" class="nav-item" data-tab="contracts" id="navContracts">
          <span class="nav-icon">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
          </span>
          <span>Manajemen Kontrak</span>
          <span class="nav-badge glow-pink" id="navContractsBadge">0 Aktif</span>
        </a>

        <a href="#adsPromo" class="nav-item" data-tab="adsPromo" id="navAdsPromo">
          <span class="nav-icon">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="12 2 2 7 12 12 22 7 12 2"/><polyline points="2 17 12 22 22 17"/><polyline points="2 12 12 17 22 12"/></svg>
          </span>
          <span>Ads & Promo Deals</span>
          <span class="nav-badge" id="navAdsPromoBadge">0 Kode</span>
        </a>

        <a href="#gameEvents" class="nav-item" data-tab="gameEvents" id="navGameEvents">
          <span class="nav-icon">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="6" x2="10" y1="12" y2="12"/><line x1="8" x2="8" y1="10" y2="14"/><line x1="15" x2="15.01" y1="13" y2="13"/><line x1="18" x2="18.01" y1="11" y2="11"/><rect width="20" height="12" x="2" y="6" rx="2"/></svg>
          </span>
          <span>Event & Turnamen Game</span>
          <span class="nav-badge glow-purple" id="navGameEventsBadge">0 Event</span>
        </a>

        <div class="nav-section-title" style="margin-top: 10px;">Artificial Intelligence</div>

        <a href="#aiAgent" class="nav-item" data-tab="aiAgent" id="navAiAgent">
          <span class="nav-icon">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2v4M12 18v4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M2 12h4M18 12h4M4.93 19.07l2.83-2.83M16.24 7.76l2.83-2.83"/></svg>
          </span>
          <span>Hermes AI Agent (PC Local)</span>
          <span class="nav-badge glow-cyan">Online</span>
        </a>
      </nav>

      <!-- Sidebar Target Progress -->
      <div class="sidebar-footer">
        <div class="target-card">
          <div class="target-title">
            <span>TARGET REVENUE STUDIO</span>
            <span id="targetPercentage" style="color: var(--accent-emerald); font-weight: 700;">0%</span>
          </div>
          <div class="target-amount" id="targetCurrentAmount">Rp 0</div>
          <div class="target-progress-bar">
            <div class="target-progress-fill" id="targetProgressBar" style="width: 0%;"></div>
          </div>
          <div class="target-sub">
            <span id="targetGoalLabel">Goal: Rp 0</span>
            <span id="targetRemainingLabel" style="color: var(--text-muted);">Belum ada kontrak aktif</span>
          </div>
        </div>
      </div>
    </aside>

    <!-- Main Content Wrapper -->
    <main class="main-wrapper">
      <!-- Top Navigation Bar -->
      <header class="topbar">
        <!-- Multi-Account Switcher -->
        <div class="account-selector-box" id="accountSwitcherGroup" title="Pilih Akun TikTok untuk Dilihat">
          <!-- Dynamically populated from connected accounts -->
        </div>

        <!-- Top Right Actions -->
        <div class="topbar-right">
          <div class="sync-status" title="Data TikTok tersinkronisasi langsung">
            <span class="sync-pulse"></span>
            <span>Live Sync</span>
          </div>

          <button class="btn-ai-quick" id="btnAiQuick" title="Buka Asisten Hermes AI">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
            <span>Tanya Hermes</span>
          </button>

          <button class="btn-quick-create" id="btnQuickCreate">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 5v14M5 12h14"/></svg>
            <span>+ Buat Baru</span>
          </button>

          <div class="user-profile-btn" title="Kaycee Profile">
            <img src="/assets/avatar.jpg" alt="Kaycee" class="user-avatar-img" />
          </div>
        </div>
      </header>

      <!-- Page Content Views -->
      <div class="content-area">
        <!-- View 1: TikTok Dashboard -->
        <section id="tiktokView" class="view-section active"></section>

        <!-- View 2: Contracts Management -->
        <section id="contractsView" class="view-section"></section>

        <!-- View 3: Ads & Promo Campaigns -->
        <section id="adsPromoView" class="view-section"></section>

        <!-- View 4: Game Events -->
        <section id="gameEventsView" class="view-section"></section>

        <!-- View 5: Kaycee AI Agent -->
        <section id="aiAgentView" class="view-section"></section>
      </div>
    </main>
  </div>

  <!-- Global Modal Component -->
  <div class="modal-backdrop" id="globalModal">
    <div class="modal-window">
      <div class="modal-header">
        <h3 id="globalModalTitle">Modal Title</h3>
        <button class="modal-close-btn" id="globalModalClose">&times;</button>
      </div>
      <div class="modal-body" id="globalModalBody"></div>
      <div class="modal-footer" id="globalModalFooter"></div>
    </div>
  </div>

  <!-- Toast Notification Container -->
  <div class="toast-container" id="toastContainer"></div>

  <!-- Main JavaScript Entrypoint -->
  <script type="module" src="/src/js/main.js"></script>
</body>
</html>
